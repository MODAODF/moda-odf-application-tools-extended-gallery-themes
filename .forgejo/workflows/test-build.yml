name: Test if product is buildable
on:
  push:
    branches:
      - '**'

jobs:
  test-build:
    name: Test if product is buildable
    runs-on: ubuntu-24.04
    steps:
      - name: Check out content from the Git repository
        uses: actions/checkout@v7
        with:
          # Fetch all history and tags
          fetch-depth: 0

          submodules: true

      - name: Install build dependencies
        run: |
          set -e
          sudo ./dev-assets/deploy-dev-environment.sh
          sudo ./sources/taiwan-road-traffic-signs/dev-assets/deploy-dev-environment.sh
          sudo ./sources/taiwan-city-county-emblems/dev-assets/deploy-dev-environment.sh

      - name: Test build product
        run: |
          ./build-product.sh
